databases:
- engine: PG
  name: db
  version: "16"
ingress:
  rules:
  - component:
      name: backend
      rewrite: /api
    match:
      path:
        prefix: /api
  - component:
      name: backend
      rewrite: /data
    match:
      path:
        prefix: /data
  - component:
      name: frontend
    match:
      path:
        prefix: /
