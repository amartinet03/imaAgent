# -----------------------------------------------------------------------------
# 3. BASE DE DATOS: PostgreSQL 16 Gestionada por DigitalOcean
# -----------------------------------------------------------------------------
databases:
- engine: PG
  name: db
  num_nodes: 1
  size: db-s-dev-database
  version: "16"
