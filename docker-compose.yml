version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: imaagent_postgres
    restart: always
    environment:
      POSTGRES_DB: imaagent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imaagent_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imaagent_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/imaagent_db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - MS365_CLIENT_ID=${MS365_CLIENT_ID}
      - MS365_CLIENT_SECRET=${MS365_CLIENT_SECRET}
      - MS365_TENANT_ID=${MS365_TENANT_ID}
      - MS365_MONITOR_EMAIL=${MS365_MONITOR_EMAIL}
    volumes:
      - ./backend/data:/app/data
      - ./backend/templates:/app/templates
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imaagent_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
