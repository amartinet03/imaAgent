<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="16" y1="16" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Antenna -->
  <line x1="32" y1="14" x2="32" y2="8" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="7" r="3.5" fill="url(#cyanGlow)" filter="url(#glow)" />

  <!-- Robot Side Ears -->
  <rect x="8" y="24" width="4" height="14" rx="2" fill="#38BDF8" />
  <rect x="52" y="24" width="4" height="14" rx="2" fill="#38BDF8" />

  <!-- Robot Head -->
  <rect x="12" y="15" width="40" height="32" rx="10" fill="url(#robotGrad)" stroke="#60A5FA" stroke-width="1.5" />

  <!-- Visor Screen -->
  <rect x="17" y="21" width="30" height="15" rx="7.5" fill="#090D16" stroke="#1E293B" stroke-width="1.2" />

  <!-- Glowing AI Eyes -->
  <circle cx="25" cy="28.5" r="3.6" fill="url(#eyeGrad)" filter="url(#glow)" />
  <circle cx="26.2" cy="27.3" r="1.1" fill="#FFFFFF" />

  <circle cx="39" cy="28.5" r="3.6" fill="url(#eyeGrad)" filter="url(#glow)" />
  <circle cx="40.2" cy="27.3" r="1.1" fill="#FFFFFF" />

  <!-- Friendly Digital Smile / Neural Wave -->
  <path d="M25 40 Q32 44 39 40" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Chest Plate -->
  <path d="M22 51 L42 51 L45 57 L19 57 Z" fill="#1E293B" stroke="#334155" stroke-width="1" rx="2" />
  <circle cx="32" cy="54" r="1.8" fill="#38BDF8" />
</svg>